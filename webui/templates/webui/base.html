<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Liam Hockey Stats</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
      header { background: #0f172a; color: white; padding: 1rem 1.5rem; }
      nav a { color: white; margin-right: 1rem; text-decoration: none; font-weight: 600; }
      main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
      .card { background: white; border-radius: 12px; padding: 1rem 1.25rem; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08); margin-bottom: 1rem; }
      .grid { display: grid; gap: 1rem; }
      .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      table { width: 100%; border-collapse: collapse; margin-top: .75rem; }
      th, td { border-bottom: 1px solid #e5e7eb; padding: .55rem; text-align: left; vertical-align: top; }
      th { background: #f8fafc; }
      form.inline { display: inline; }
      input, select, textarea, button { font: inherit; padding: .45rem .55rem; }
      input, select, textarea { width: 100%; box-sizing: border-box; }
      button, .button-link { background: #2563eb; color: white; border: 0; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
      button.secondary, .button-link.secondary { background: #475569; }
      button.danger { background: #dc2626; }
      .notice { background: #dcfce7; color: #166534; padding: .75rem 1rem; border-radius: 10px; margin-bottom: 1rem; }
      .error { background: #fee2e2; color: #991b1b; padding: .75rem 1rem; border-radius: 10px; margin-bottom: 1rem; }
      .muted { color: #64748b; }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .75rem 1rem; }
      .actions { display: flex; gap: .5rem; justify-content: flex-end; align-items: center; }
      ul.errorlist { margin: .35rem 0 0; color: #b91c1c; padding-left: 1.2rem; }
      .season-pill { display: inline-block; padding: .3rem .6rem; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <h1 style="margin:0 0 .5rem;">Liam Hockey Stats — Django v3</h1>
      <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'roster' %}">Roster</a>
        <a href="{% url 'new-game' %}">Game entry</a>
        <a href="{% url 'correction-picker' %}">Corrections</a>
        <a href="{% url 'mailing' %}">Mailing</a>
      </nav>
    </header>
    <main>
      {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
